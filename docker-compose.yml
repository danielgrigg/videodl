# Local build-from-source stack (`just up`). Enclave does not use this file — its
# service is defined in griggx-gitops (nodes/enclave/compose.yml).
services:
  videodl:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ${VIDEO_STORAGE_PATH:-/srv/data0/studio/videos}:/data/videos
    environment:
      - VIDEO_DIR=/data/videos
      - MAX_CONCURRENT=${MAX_CONCURRENT:-2}
    restart: unless-stopped
