<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>videodl</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>videodl</h1>
    <form method="post" action="/download" class="dl-form">
      <input type="url" name="url" placeholder="Paste a video or playlist URL…" required autofocus>
      <button type="submit">Download</button>
    </form>
  </header>

  <section id="jobs" class="jobs">
    {% for job in jobs %}
      {% include "_job.html" %}
    {% endfor %}
  </section>

  {% for folder, videos in folders %}
    <section class="grid">
      {% if folder %}<h2 class="folder">{{ folder }}</h2>{% endif %}
      {% for video in videos %}
        {% include "_tile.html" %}
      {% endfor %}
    </section>
  {% else %}
    <section class="grid">
      <p class="empty">No videos yet. Paste a URL above to get started.</p>
    </section>
  {% endfor %}

  <script src="/static/sse.js"></script>
</body>
</html>
