<article class="tile">
  <a href="/videos/{{ video.path | urlencode }}" class="thumb">
    <img src="/thumb/{{ video.path | urlencode }}" alt="" loading="lazy">
    <span class="play">▶</span>
  </a>
  <div class="meta">
    <span class="name" title="{{ video.name }}">{{ video.name }}</span>
  </div>
</article>
